# ============================================
# Anima Training - Finetune 
# 1024+1280px | 10 epochs 
# ============================================

output_dir = '/home/jovyan/outputs/TelescopaV0.1Finetune'
dataset = '/home/jovyan/configs/anima-dataset-phase2.toml'

# Training settings
epochs = 10
micro_batch_size_per_gpu = 5                 
pipeline_stages = 2
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 20                            # Short warmup 
compile = true
# Block swapping for lower VRAM usage (LoRA only-optional)
# blocks_to_swap = 10

# Save settings
save_every_n_epochs = 1
activation_checkpointing = 'unsloth'
save_dtype = 'bfloat16'
caching_batch_size = 4

[model]
type = 'anima'
transformer_path = '/home/jovyan/models/transformer/anima-base-v1.0.safetensors'  
vae_path = '/home/jovyan/models/vae/qwen_image_vae.safetensors'
qwen_path = '/home/jovyan/models/text_encoder/qwen3-06b'

dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
sigmoid_scale = 1.3
shift = 4

flow_use_ot = true
cfm_enabled = false
cfm_lambda = 0.02

# Caption settings 
cache_text_embeddings = false
shuffle_tags = true
tag_dropout_percent = 0.1
caption_dropout_percent = 0.05
caption_mode = "mixed"
mixed_weights = { tags = 25, nl = 25, tags_nl = 25, nl_tags = 25 }
nl_shuffle_sentences = true
tag_delimiter = ', '

# Component toggles 
train_self_attn = true
train_cross_attn = true
train_mlp = true
train_adaln = false
train_llm_adapter = false

qwen_nf4 = true

# ============================================

[optimizer]
type = 'AdamW8bitKahan'
lr = 3e-6                                   
betas = [0.9, 0.999]
weight_decay = 0.01
eps = 1e-8